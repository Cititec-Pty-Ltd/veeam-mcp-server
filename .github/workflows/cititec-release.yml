# Cititec release: test and build servers/vi-mcp (Veeam Intelligence MCP server) and push
# the Docker image to ghcr.io/cititec-pty-ltd/veeam-vi-mcp. Cititec-only - never send this
# file to Veeam (see CITITEC-FORK.md).
#
# Veeam does not tag releases, so each image is tagged with the package.json version plus
# the short commit (example: v1.0.0-deac916) and with latest. The MCP host pins the image by
# digest, so a new image changes nothing until control.json is updated.
name: Cititec release

on:
  push:
    branches: [main]
    paths:
      - 'servers/vi-mcp/**'
      - '.github/workflows/cititec-release.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write       # push the image to ghcr.io/cititec-pty-ltd

concurrency:
  group: cititec-release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/cititec-pty-ltd/veeam-vi-mcp

defaults:
  run:
    working-directory: servers/vi-mcp

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: servers/vi-mcp/.nvmrc
          cache: npm
          cache-dependency-path: servers/vi-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Work out the image tag
        id: tag
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "tag=v${version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Build and push image
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: servers/vi-mcp
          platforms: linux/amd64
          push: true
          # Without this, the pushed digest can be an attestation manifest, not the image
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "Image: \`$IMAGE:$TAG\`"
            echo
            echo "Pin on the MCP host: \`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
